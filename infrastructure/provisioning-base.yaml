    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-CertProviderSignerFunctionName"

  CertProviderSignerFunctionArn:
    Description: >-
      Function ARN referenced by create-certificate-provider --lambda-function-arn
      in the Module 3 OPTIONAL certificate-provider lab.
    Value:
      Fn::GetAtt:
        - CertProviderSignerFunction
        - Arn
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-CertProviderSignerFunctionArn"

  RotationThingGroupName:
    Description: >-
      Static thing group that acts as the rotation work queue in Module 6. Adding a
      thing to this group enqueues a certificate rotation for the continuous job.
    Value:
      Ref: RotationThingGroup
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-RotationThingGroupName"

  RotationThingGroupArn:
    Description: ARN of the Module 6 rotation work-queue thing group (the job target).
    Value:
      Fn::GetAtt:
        - RotationThingGroup
        - Arn
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-RotationThingGroupArn"

  RotationHandlerFunctionName:
    Description: >-
      Function name learners target with aws lambda update-function-code in Module 6.
