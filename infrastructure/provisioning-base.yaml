    Value:
      Fn::GetAtt:
        - RotationHandlerFunction
        - Arn
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-RotationHandlerFunctionArn"

  RotationRevokeSchedulerRoleArn:
    Description: >-
      ARN of the role Amazon EventBridge Scheduler assumes when the Module 6
      deferred-deletion timer fires.
    Value:
      Fn::GetAtt:
        - RotationRevokeSchedulerRole
        - Arn
