  # =========================================================================
  # Certificate rotation (Module 6) — backend-orchestrated rotation plumbing
  #
  # Module 6 rotates a device certificate with an AWS IoT Jobs-driven flow: a
  # CONTINUOUS job targets a static thing group (group membership == "needs
  # rotation"), the device generates a key pair and CSR locally and publishes the
  # CSR, and this rotation-handler Lambda signs it, attaches the new certificate to
  # the thing + policy, and hands the certificate back over MQTT. After the device
  # proves the new certificate works, the handler detaches and DEACTIVATES the old
  # certificate and schedules its deletion with a one-time Amazon EventBridge
  # Scheduler timer (reversible first, irreversible later).
  #
  # That timer invokes THIS SAME handler on a third entry point rather than calling
  # iot:DeleteCertificate directly, so the one irreversible step in the flow re-reads
  # the certificate's state before acting and abandons the deletion if somebody rolled
  # the rotation back. See RotationRevokeSchedulerRole below for why that makes this
  # the narrowest role in the stack.
  #
  # Learners create the topic rule and the job themselves (the teaching artifacts),
  # exactly as they create the JITR topic rule in Module 3. Everything below is the
  # undifferentiated plumbing.
  # =========================================================================

  # Static thing group that acts as the rotation work queue. A CONTINUOUS job
  # targeting this group starts a rotation for every thing added to it, and the
  # handler removes the thing from the group when rotation succeeds.
  RotationThingGroup:
    Type: AWS::IoT::ThingGroup
    Properties:
      ThingGroupName: ws-aws-iot-dm-adv-prov-rotation
      ThingGroupProperties:
        ThingGroupDescription: >-
          Rotation work queue for Module 6. Add a thing to this group to enqueue a
          certificate rotation; the rotation handler removes it again on success.
      Tags:
        - Key: workshop
          Value: aws-iot-dm-advanced-provisioning
        - Key: purpose
          Value: certificate-rotation-queue

  # Execution role for the rotation handler (Module 6). This is the widest role in
  # the stack because the handler performs the whole cloud-side identity swap: sign
  # the CSR, attach/detach the certificate and policy, read and update the job
  # execution, publish the certificate back to the device, remove the thing from the
  # rotation group, and create the deferred-deletion schedule.
  RotationHandlerExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >-
              Explicit RoleName is a fixed, module-prefixed stable identifier
              (ws-aws-iot-dm-adv-prov-*, not stack-name-derived) that Module 6 looks up
              by exact name with iam get-role. The stack is disposable workshop
              infrastructure, so replace-on-update is acceptable.
          - id: W11
            reason: >-
              Two actions are granted on "*" because neither supports resource-level
              permissions in a way this flow can use: iot:CreateCertificateFromCsr has no
              certificate ARN to scope to until the call returns, and iot:DescribeEndpoint
              (used to resolve the data and jobs endpoints the handler calls) is not
              resource-scoped. This template scopes every other action in this role to
              this account and Region by resource type (cert/*, thing/*, policy/*,
              thinggroup/*, job/*, and the rotation response topics only).
    Properties:
      RoleName: ws-aws-iot-dm-adv-prov-rotation-handler-role
      Description: >-
        Execution role for the Module 6 certificate-rotation handler AWS Lambda
        function. Grants Amazon CloudWatch Logs write access plus the scoped AWS IoT
        actions the rotation flow performs, and permission to create the one-time
        Amazon EventBridge Scheduler schedule that deletes the old certificate later.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cloudwatch-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - Fn::Sub: "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/ws-aws-iot-dm-adv-prov-rotation-handler:*"
        - PolicyName: rotation-sign-csr
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The new certificate has no ARN until this call returns, so there is
              # nothing narrower to scope to. See the W11 suppression above.
              - Sid: SignCertificateSigningRequest
                Effect: Allow
                Action: iot:CreateCertificateFromCsr
                Resource: "*"
              # The handler resolves the data endpoint (to publish the certificate back
              # to the device) and the jobs endpoint (to update the job execution).
              # DescribeEndpoint is not resource-scoped.
              - Sid: ResolveEndpoints
                Effect: Allow
                Action: iot:DescribeEndpoint
                Resource: "*"
        - PolicyName: rotation-identity-swap
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Read the certificate (including re-fetching its PEM when a device asks
              # for it again), activate the new one, and deactivate/delete the old one.
              - Sid: ManageCertificates
                Effect: Allow
                Action:
                  - iot:DescribeCertificate
                  - iot:UpdateCertificate
                  - iot:DeleteCertificate
                Resource:
                  - Fn::Sub: "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:cert/*"
              # Attach the new certificate to the thing and the policy to the new
              # certificate; detach both from the old certificate after cutover.
              #
              # The two list actions are what make the deferred deletion safe: before
              # deleting a superseded certificate the handler lists the thing's
              # principals and the certificate's attached policies, and abandons the
              # deletion if either shows the certificate back in service.
              - Sid: AttachAndDetachPrincipals
                Effect: Allow
                Action:
                  - iot:AttachPolicy
                  - iot:DetachPolicy
                  - iot:AttachThingPrincipal
                  - iot:DetachThingPrincipal
                  - iot:ListThingPrincipals
                  - iot:ListAttachedPolicies
                Resource:
                  - Fn::Sub: "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:cert/*"
                  - Fn::Sub: "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:policy/*"
                  - Fn::Sub: "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:thing/*"
              # Remove the thing from the rotation queue once rotation succeeds.
              - Sid: LeaveRotationQueue
                Effect: Allow
                Action: iot:RemoveThingFromThingGroup
                Resource:
                  - Fn::Sub: "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:thing/*"
                  - Fn::Sub: "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:thinggroup/ws-aws-iot-dm-adv-prov-rotation"
        - PolicyName: rotation-jobs-and-delivery
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The job execution is the rotation state machine: the handler reads the
              # current phase and writes the next one (including the new certificate id,
              # which is what makes the flow resumable).
              #
              # Jobs is split across two IAM prefixes and the handler needs both.
              # READING the job execution is a CONTROL-plane action (iot: prefix, on the
              # thing and job resources); WRITING the execution status is a DATA-plane
              # action (iotjobsdata: prefix, on the thing resource). The two prefixes are
              # not interchangeable: granting iot:UpdateJobExecution would not authorize
              # the write, and each prefix has its own DescribeJobExecution. Only the
              # control-plane read is granted here, because that is the one the handler
              # calls.
              - Sid: ReadJobExecutionControlPlane
                Effect: Allow
                Action: iot:DescribeJobExecution
                Resource:
                  - Fn::Sub: "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:thing/*"
                  - Fn::Sub: "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:job/*"
              - Sid: UpdateJobExecutionDataPlane
                Effect: Allow
                Action: iotjobsdata:UpdateJobExecution
                Resource:
                  - Fn::Sub: "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:thing/*"
              # Publish the signed certificate back to the requesting device, scoped to
              # the rotation response topics only.
              - Sid: PublishRotationResponse
                Effect: Allow
                Action: iot:Publish
                Resource:
                  - Fn::Sub: "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/devices/*/certificate/rotation/response"
        - PolicyName: rotation-state-record
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The backend-authored half of the rotation state — which certificate
              # was issued, which one it supersedes, and when it was retired — lives
              # in a dedicated NAMED SHADOW (ws-rotation), not in the job
              # execution's statusDetails.
              #
              # Why not statusDetails: that map is REPLACED wholesale on every
              # UpdateJobExecution, and the device writes it too, so the device's
              # status report erases anything the backend put there. Worse, reading
              # the certificate to keep from a device-written map would let a device
              # choose which of its own credentials gets destroyed.
              #
              # Note the resource form: shadow actions accept BOTH thing/<thing> and
              # thing/<thing>/<shadowName>, so pinning the shadow name is what makes
              # this grant narrow. It authorizes this ONE shadow on any thing and
              # nothing else — not the classic shadow, not any other named shadow.
              #
              # DeleteThingShadow is deliberately NOT granted. The handler only ever
              # writes and reads the record; the learner removes it in the reset
              # block under their own credentials.
              - Sid: MaintainRotationRecordShadow
                Effect: Allow
                Action:
                  - iot:UpdateThingShadow
                  - iot:GetThingShadow
                Resource:
                  - Fn::Sub: "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:thing/*/ws-rotation"
        - PolicyName: rotation-deferred-deletion
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Create the one-time schedule that revokes the old certificate after
              # the grace period. Scoped to this module's schedule names.
              #
              # CreateSchedule is the only action needed: the schedule carries
              # ActionAfterCompletion=DELETE, so it removes itself once it has fired,
              # and the handler never reads or deletes a schedule itself. Learners do
              # run scheduler get-schedule and delete-schedule in Module 6, but under
              # their own credentials, not this role.
              - Sid: ManageDeferredDeletionSchedule
                Effect: Allow
                Action: scheduler:CreateSchedule
                Resource:
                  - Fn::Sub: "arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/ws-aws-iot-dm-adv-prov-revoke-*"
              # A schedule runs under its own role, so the handler must be allowed to
              # hand that role to Amazon EventBridge Scheduler when creating it.
              - Sid: PassSchedulerRole
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  Fn::GetAtt:
                    - RotationRevokeSchedulerRole
                    - Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: scheduler.amazonaws.com
      Tags:
        - Key: workshop
          Value: aws-iot-dm-advanced-provisioning
        - Key: purpose
          Value: rotation-handler-execution

  # Role that Amazon EventBridge Scheduler assumes when the deferred-deletion timer
  # fires. The timer's target is the rotation handler, NOT the AWS IoT API, so
  # lambda:InvokeFunction is the only permission this role needs.
  #
  # That indirection is deliberate and it is the reason this role is so narrow.
  # Amazon EventBridge Scheduler can call an AWS API directly as a universal target,
  # and pointing one at iot:DeleteCertificate would work — but it would fire a delete
  # decided minutes earlier with no opportunity to reconsider it. Deletion is the only
  # irreversible step in the whole rotation, so Module 6 routes it through the handler,
  # which re-reads the certificate's current state and abandons the deletion if
  # somebody rolled the rotation back. A function also has a log group, so a deletion
  # that did not happen is visible; a universal target's failure would be silent,
  # because this schedule has no dead-letter queue and ActionAfterCompletion=DELETE
  # removes it either way.
  RotationRevokeSchedulerRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >-
              Explicit RoleName is a fixed, module-prefixed stable identifier
              (ws-aws-iot-dm-adv-prov-*, not stack-name-derived) so the rotation
              handler can pass this role to Amazon EventBridge Scheduler by a name
              that does not change between deployments. The stack is disposable
              workshop infrastructure, so replace-on-update is acceptable.
    Properties:
      RoleName: ws-aws-iot-dm-adv-prov-rotation-revoke-scheduler-role
      Description: >-
        Assumed by Amazon EventBridge Scheduler when the Module 6 deferred-deletion
        timer fires. Its only permission is to invoke the rotation handler, which
        re-checks the certificate's state before deleting it.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
      Policies:
        - PolicyName: revoke-superseded-certificate
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Deliberately the ONLY statement. This role cannot touch a
              # certificate directly; it can only ask the handler to decide.
              - Sid: InvokeRotationHandler
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - Fn::Sub: "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:ws-aws-iot-dm-adv-prov-rotation-handler"
      Tags:
        - Key: workshop
          Value: aws-iot-dm-advanced-provisioning
        - Key: purpose
          Value: rotation-deferred-deletion

  RotationHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: >-
              Ephemeral workshop log group for a disposable stack; log data is
              non-sensitive placeholder/handler output. A customer-managed KMS key
              adds cost and operational complexity with no security benefit here.
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: >-
              Ephemeral workshop log group; non-sensitive logs, no CMK encryption
              required for disposable teaching infrastructure.
    Properties:
      LogGroupName: /aws/lambda/ws-aws-iot-dm-adv-prov-rotation-handler
      RetentionInDays: 14

  # Rotation handler skeleton. Fail-closed on purpose: until learners deploy the real
  # code in Module 6, the function raises rather than signing a certificate signing
  # request, so a misconfigured rule can never mint a certificate unattended.
  RotationHandlerFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - RotationHandlerLogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W58
            reason: >-
              False positive: RotationHandlerExecutionRole grants logs:CreateLogStream
              and logs:PutLogEvents scoped to this function's log group. cfn_nag does
              not trace the scoped inline policy.
          - id: W89
            reason: >-
              Function calls public AWS IoT, Amazon EventBridge Scheduler, and Amazon
              CloudWatch Logs APIs only; a VPC would add NAT plumbing with no benefit
              for disposable workshop infrastructure.
          - id: W92
            reason: >-
              Single-learner invocation in a disposable stack; reserved concurrency is
              unnecessary.
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: Single-learner workshop function; no concurrency limit needed.
          - id: CKV_AWS_116
            comment: >-
              Fail-closed skeleton with no async payloads to preserve; a DLQ is
              unnecessary for disposable teaching infrastructure.
          - id: CKV_AWS_117
            comment: Function uses only public AWS APIs; VPC deployment not required.
          - id: CKV_AWS_173
            comment: >-
              Environment variables are non-sensitive (paths, a group name, a role ARN,
              and a grace-period value); CMK encryption not required.
    Properties:
      FunctionName: ws-aws-iot-dm-adv-prov-rotation-handler
      Description: >-
        Certificate-rotation handler skeleton for Module 6. Learners deploy the real
        handler code via aws lambda update-function-code. Until then the skeleton
        fails closed so no certificate is signed or deleted unattended.
      Runtime: python3.12
      Handler: index.handler
      # 30s is ample: the handler signs one CSR and makes a handful of control-plane
      # calls. It is not on the pre-provisioning-hook 5-second path.
      Timeout: 30
      MemorySize: 256
      Role:
        Fn::GetAtt:
          - RotationHandlerExecutionRole
          - Arn
      Environment:
        Variables:
          HOME_FOLDER:
            Ref: HomeFolder
          WORKSHOP_TOPIC: aws-iot-dm-advanced-provisioning
          ROTATION_THING_GROUP:
            Ref: RotationThingGroup
          REVOKE_SCHEDULER_ROLE_ARN:
            Fn::GetAtt:
              - RotationRevokeSchedulerRole
              - Arn
          # Named shadow holding the BACKEND's half of the rotation state. The
          # device has no policy permitting it to read or write this shadow, which
          # is the point: the certificate to keep is a backend decision. Must match
          # the shadow name pinned in the execution role's rotation-state-record
          # policy above.
          ROTATION_SHADOW_NAME: ws-rotation
          # Grace period between deactivating the old certificate and deleting it.
          # Deliberately short so the timer fires within a workshop session.
          REVOKE_GRACE_MINUTES: "10"
      Code:
        ZipFile: |
          """Certificate-rotation handler skeleton (placeholder).

          Learners replace this in Module 6 with the real handler, which:
            1. verifies the requesting certificate is attached to the thing and ACTIVE,
               and that an IN_PROGRESS rotation job execution exists for that thing,
            2. validates the certificate signing request before signing it,
            3. signs it, records the new certificate id in the thing's ws-rotation
               NAMED SHADOW FIRST (a backend-only store the device cannot write —
               the job execution's statusDetails is replaced wholesale by whoever
               writes last, and the device writes it too), then attaches the
               certificate to the thing and the policy to the certificate,
            4. publishes the certificate back to the device, and
            5. on the job-execution succeeded event, detaches and deactivates the old
               certificate and schedules its deletion after a grace period.

          Until then this skeleton fails closed so a misconfigured topic rule cannot
          sign a certificate signing request or delete a certificate unattended.
          """

          def handler(event, context):
              raise NotImplementedError(
                  "Rotation handler not yet implemented. Deploy your Module 6 code "
                  "with 'aws lambda update-function-code'."
              )
      Tags:
        - Key: workshop
          Value: aws-iot-dm-advanced-provisioning
        - Key: purpose
          Value: rotation-handler

  # Allow AWS IoT Core (topic rule action) to invoke the rotation handler when the
  # Module 6 rules on the certificate signing request topic and on the
  # job-execution succeeded event fire.
  RotationHandlerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::GetAtt:
          - RotationHandlerFunction
          - Arn
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceAccount:
        Ref: AWS::AccountId

